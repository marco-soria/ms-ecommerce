name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta de forma segura una vez al día a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions si lo deseas

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database via PostgREST
        run: |
          curl -f -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/products?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
