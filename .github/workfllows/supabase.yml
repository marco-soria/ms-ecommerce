name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta de forma segura dos veces al día para evitar la suspensión por inactividad
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions si lo deseas

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Auth Health Endpoint
        run: |
          curl -f -i -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}"
