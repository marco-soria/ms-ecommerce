name: Supabase Request

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC (Media noche)
    - cron: '0 0 * * *'
  workflow_dispatch: # Te permite ejecutar el job manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Supabase Request
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
