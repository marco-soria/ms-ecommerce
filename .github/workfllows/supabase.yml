name: Supabase Request

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC y a las 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=count" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"