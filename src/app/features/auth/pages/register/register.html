<section class="mx-auto flex min-h-[70vh] max-w-md items-center px-4 py-10">
  <form
    class="w-full space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900"
    (submit)="onSubmit($event)"
  >
    <header class="space-y-1">
      <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Register</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Create an account to start shopping.
      </p>
    </header>

    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Name</span>
      <input
        type="text"
        name="name"
        required
        autocomplete="name"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </label>

    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</span>
      <input
        type="email"
        name="email"
        required
        autocomplete="email"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </label>

    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</span>
      <input
        type="password"
        name="password"
        required
        autocomplete="new-password"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </label>

    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Confirm password</span>
      <input
        type="password"
        name="confirmPassword"
        required
        autocomplete="new-password"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        [class.border-rose-500]="showPasswordError()"
        [value]="confirmPassword()"
        (input)="confirmPassword.set($any($event.target).value)"
      />
    </label>

    @if (showPasswordError()) {
      <p class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700 dark:bg-rose-950 dark:text-rose-300">
        Passwords do not match.
      </p>
    }

    <button
      type="submit"
      class="w-full rounded-xl bg-teal-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-teal-600 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 dark:disabled:bg-slate-700 dark:disabled:text-slate-400"
      [disabled]="showPasswordError()"
    >
      Register
    </button>

    <p class="text-center text-sm text-slate-600 dark:text-slate-400">
      Already have an account?
      <a routerLink="/login" class="font-semibold text-teal-700 hover:underline dark:text-teal-400">
        Login
      </a>
      ·
      <a routerLink="/catalog" class="font-semibold text-teal-700 hover:underline dark:text-teal-400">
        Back to shop
      </a>
    </p>
  </form>
</section>
