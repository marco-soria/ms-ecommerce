<section class="mx-auto flex min-h-[70vh] max-w-md items-center px-4 py-10">
  <form
    class="w-full space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900"
    (submit)="onSubmit($event)"
  >
    <header class="space-y-1">
      <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Login</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Enter your credentials to continue.
      </p>
    </header>

    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</span>
      <input
        type="email"
        name="email"
        required
        autocomplete="email"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </label>

    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</span>
      <input
        type="password"
        name="password"
        required
        autocomplete="current-password"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </label>

    <button
      type="submit"
      class="w-full rounded-xl bg-teal-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-teal-600"
    >
      Login
    </button>

    <p class="text-center text-sm text-slate-600 dark:text-slate-400">
      No account?
      <a routerLink="/register" class="font-semibold text-teal-700 hover:underline dark:text-teal-400">
        Register
      </a>
      ·
      <a routerLink="/catalog" class="font-semibold text-teal-700 hover:underline dark:text-teal-400">
        Back to shop
      </a>
    </p>
  </form>
</section>
