@let item = product();
@let level = item.stock | stockLevel;
@let isCompact = compact();

<article
  [class]="
    isCompact
      ? 'flex gap-3'
      : 'relative flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition dark:border-slate-700 dark:bg-slate-900'
  "
  [class.opacity-70]="level === 'out'"
>
  @if (showFavorite() && !isCompact) {
    <button
      type="button"
      class="absolute right-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white/90 shadow-sm transition hover:scale-105 dark:bg-slate-900/90"
      (click)="onToggleFavorite($event)"
      [attr.aria-label]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
      [attr.title]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="h-5 w-5 transition"
        [class]="isFavorite() ? 'fill-rose-500 text-rose-500' : 'fill-none text-slate-500'"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
        />
      </svg>
    </button>
  }

  <div
    [class]="
      isCompact
        ? 'h-16 w-16 shrink-0 overflow-hidden rounded-xl bg-slate-100 dark:bg-slate-800'
        : 'relative aspect-square overflow-hidden bg-slate-100 dark:bg-slate-800'
    "
  >
    <img
      [src]="item.image"
      [alt]="item.name"
      class="h-full w-full object-cover"
      loading="lazy"
    />
  </div>

  <div
    [class]="
      isCompact
        ? 'min-w-0 flex-1 space-y-1'
        : 'flex flex-1 flex-col gap-3 p-4'
    "
  >
    <div class="space-y-1">
      <div class="flex items-start justify-between gap-2">
        <h3
          [class]="
            isCompact
              ? 'truncate text-sm font-semibold text-slate-900 dark:text-slate-100'
              : 'text-lg font-semibold text-slate-900 dark:text-slate-100'
          "
        >
          {{ item.name }}
        </h3>

        @if (showFavorite() && isCompact) {
          <button
            type="button"
            class="shrink-0"
            (click)="onToggleFavorite($event)"
            [attr.aria-label]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="h-4 w-4"
              [class]="isFavorite() ? 'fill-rose-500 text-rose-500' : 'fill-none text-slate-500'"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
              />
            </svg>
          </button>
        }
      </div>
      <p
        [class]="
          isCompact
            ? 'text-sm font-bold text-teal-700 dark:text-teal-400'
            : 'text-xl font-bold text-teal-700 dark:text-teal-400'
        "
      >
        {{ item.price | currency: 'USD' : 'symbol' : '1.2-2' }}
      </p>
    </div>

    <p
      class="inline-flex w-fit rounded-md font-medium"
      [class]="
        (isCompact ? 'px-1.5 py-0.5 text-[10px] ' : 'px-2 py-1 text-xs ') +
        (level === 'out'
          ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
          : level === 'low'
            ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
            : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300')
      "
    >
      {{ item.stock | stockLabel }}
    </p>

    <div [class]="isCompact ? 'pt-1' : 'mt-auto pt-2'">
      <ng-content />
    </div>
  </div>
</article>
