
<div class="min-h-dvh bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <app-site-header
    [currentView]="currentView()"
    [favoritesCount]="favoritesCount()"
    (viewChange)="setView($event)"
  />

  @switch (currentView()) {
    @case ('login') {
      <app-login
        (navigateToRegister)="setView('register')"
        (navigateToShop)="setView('shop')"
      />
    }
    @case ('register') {
      <app-register
        (navigateToLogin)="setView('login')"
        (navigateToShop)="setView('shop')"
      />
    }
    @default {
      <main class="mx-auto grid max-w-7xl gap-6 px-4 py-8 lg:grid-cols-[minmax(0,1fr)_22rem] lg:items-start">
        <app-catalog (favoritesCountChange)="onFavoritesCountChange($event)" />

        <div class="lg:sticky lg:top-20">
          @defer (on idle) {
            <app-cart />
          } @placeholder {
            <aside
              class="rounded-2xl border border-dashed border-slate-300 px-4 py-10 text-center text-sm text-slate-500 dark:border-slate-600 dark:text-slate-400"
            >
              Loading cart...
            </aside>
          }
        </div>
      </main>
    }
  }
</div>
