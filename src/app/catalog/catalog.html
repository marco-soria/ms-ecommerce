<section>
  <header class="mb-6 space-y-2">
    <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-50">Catalog</h1>
    <p class="text-slate-600 dark:text-slate-400">
      Browse products and adjust quantities with + and -.
    </p>
  </header>

  @if (loading()) {
    <p class="text-slate-500 dark:text-slate-400">Loading products...</p>
  } @else if (error()) {
    <p class="rounded-lg bg-rose-50 px-4 py-3 text-rose-700 dark:bg-rose-950 dark:text-rose-300">
      {{ error() }}
    </p>
  } @else if (products().length === 0) {
    <p class="text-slate-500 dark:text-slate-400">No products available.</p>
  } @else {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3">
      @for (product of products(); track product.id) {
        <app-product-details [product]="product">
          <div class="flex items-center justify-center gap-3">
            <button
              type="button"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-300 text-xl font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
              [disabled]="!canDecrease(product)"
              (click)="decrease(product)"
              aria-label="Decrease quantity"
            >
              −
            </button>

            <span
              class="min-w-8 text-center text-lg font-semibold text-slate-900 dark:text-slate-100"
            >
              {{ quantityOf(product) }}
            </span>

            <button
              type="button"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-300 text-xl font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
              [disabled]="!canIncrease(product)"
              (click)="increase(product)"
              aria-label="Increase quantity"
            >
              +
            </button>
          </div>
        </app-product-details>
      }
    </div>
  }
</section>
