@let item = product();

<div
  class="rounded-2xl border border-slate-200 bg-white p-3 dark:border-slate-700 dark:bg-slate-900"
>
  <app-product-details [product]="item" [compact]="true">
    <button
      type="button"
      class="rounded-lg border border-rose-300 px-2.5 py-1 text-xs font-semibold text-rose-700 transition hover:bg-rose-50 dark:border-rose-700 dark:text-rose-300 dark:hover:bg-rose-950"
      (click)="remove.emit()"
    >
      Delete
    </button>
  </app-product-details>

  <div
    class="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3 dark:border-slate-800"
  >
    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Quantity</p>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg border border-slate-300 text-base font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
        (click)="decrease()"
        aria-label="Decrease quantity"
      >
        −
      </button>
      <span class="min-w-6 text-center text-sm font-semibold text-slate-900 dark:text-slate-100">
        {{ quantity() }}
      </span>
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg border border-slate-300 text-base font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
        [disabled]="quantity() >= item.stock"
        (click)="increase()"
        aria-label="Increase quantity"
      >
        +
      </button>
    </div>
  </div>
</div>
